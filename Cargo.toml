[workspace]
resolver = "2"
members = ["crates/fem-core", "crates/cert-core", "crates/verify-wasm", "crates/cells"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Leif Rydenfalk"]
repository = "https://github.com/ce-net/demo-verified-result"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
